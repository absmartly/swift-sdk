name: Swift-SDK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  test-macos:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 16.x: the oldest toolchain with Swift 6 language mode
          - name: xcode-16
            runs-on: macos-15
            xcode: /Applications/Xcode_16.4.app
          - name: latest
            runs-on: macos-latest
            xcode: ""
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Show Swift version
        run: swift --version

      # Swift 6 language mode implies complete strict concurrency checking.
      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test --skip-build

      - name: Build for Apple device platforms
        run: |
          for destination in "generic/platform=iOS Simulator" "generic/platform=tvOS Simulator" \
            "generic/platform=watchOS Simulator" "generic/platform=visionOS Simulator" \
            "generic/platform=macOS,variant=Mac Catalyst"; do
            for scheme in ABsmartly ABsmartlyUI; do
              echo "::group::$scheme $destination"
              xcodebuild build -scheme "$scheme" -destination "$destination" -quiet \
                SWIFT_TREAT_WARNINGS_AS_ERRORS=YES || exit 1
              echo "::endgroup::"
            done
          done

      # The Example app references this checkout as a local package and has its own lockfile.
      # Resolve strictly from it, so a lockfile that no longer satisfies Package.swift fails CI.
      - name: Build the Example app from its lockfile
        run: |
          xcodebuild build -project Example/Example.xcodeproj -scheme Example \
            -destination "generic/platform=iOS Simulator" -onlyUsePackageVersionsFromResolvedFile -quiet \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  test-linux:
    name: test (linux, ${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ['swift:6.0', 'swift:latest']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test --skip-build

      # Optimized builds compile out the DEBUG-only test hooks; the rest of the suite must still build
      # and pass.
      - name: Run tests (release)
        run: swift test -c release -Xswiftc -enable-testing -Xswiftc -warnings-as-errors

  # swift-format ships with the toolchain; a pinned image, so a new release cannot fail CI by itself.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lint (swift-format)
        run: swift format lint --strict --configuration swift-format.json -r Sources Tests Example

  pod-lint:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lint podspec
        run: pod lib lint ABsmartly.podspec --allow-warnings --skip-tests
