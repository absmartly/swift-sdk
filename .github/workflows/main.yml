name: Swift-SDK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 6.1 provides additional toolchain coverage
          - name: swift-6.1
            runs-on: macos-15
            xcode: /Applications/Xcode_16.3.app
          - name: latest
            runs-on: macos-latest
            xcode: ""
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      # The Example app references this checkout as a local package and has its own lockfile.
      # Resolve strictly from it, so a lockfile that no longer satisfies Package.swift fails CI.
      - name: Resolve Example app packages from its lockfile
        run: |
          xcodebuild -resolvePackageDependencies -project Example/Example.xcodeproj -scheme Example \
            -onlyUsePackageVersionsFromResolvedFile

  test-linux:
    name: test (linux, swift-6.1)
    runs-on: ubuntu-latest
    container: swift:6.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
