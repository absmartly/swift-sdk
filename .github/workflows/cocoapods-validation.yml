name: CocoaPods validation (manual)

# Diagnostic until the owner decision described in docs/cocoapods-validation.md is made
# and implemented. Not a required/green packaging gate, and never publishes to trunk.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Full lint (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 16.3
            runner: macos-15
            xcode: /Applications/Xcode_16.3.app
          # Whatever macos-latest ships (Xcode 26.x when added); the log's first lines show the
          # resolved version. Xcode 27.2, which the owner decision rests on, is not on hosted runners yet.
          - name: current Xcode
            runner: macos-latest
            xcode: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode
        if: matrix.xcode != ''
        run: sudo xcode-select -s "${{ matrix.xcode }}"
      # CocoaPods 1.17.0's simulator lookup can crash before building iOS/tvOS; see
      # scripts/xcrun-simctl-json.sh. The wrapper only changes how the simulator list is read.
      - name: Install simctl JSON wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/xcrun-shim"
          cp scripts/xcrun-simctl-json.sh "$RUNNER_TEMP/xcrun-shim/xcrun"
          chmod +x "$RUNNER_TEMP/xcrun-shim/xcrun"
          echo "$RUNNER_TEMP/xcrun-shim" >> "$GITHUB_PATH"
      - name: Full CocoaPods validation
        run: |
          set -o pipefail
          bash scripts/validate-cocoapods.sh 2>&1 | tee cocoapods-validation.log
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cocoapods-${{ strategy.job-index }}
          path: cocoapods-validation.log
          if-no-files-found: warn
