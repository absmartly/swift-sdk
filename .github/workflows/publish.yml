name: Publish Swift-SDK

# Swift Package Manager resolves releases straight from the git tag; this checks the tag matches
# the podspec and SDK version and runs the tests. Nothing is published to CocoaPods: 1.3.4 is the
# last version on the trunk, and later 1.x versions are Swift Package Manager only (see README).
on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The tag, the podspec and the X-Agent version must agree, or the version the SDK reports
      # would not match the code SwiftPM users get from the tag.
      - name: Check versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          podspec_version=$(sed -nE "s/^[[:space:]]*spec\.version[[:space:]]*=[[:space:]]*'([^']+)'.*/\1/p" ABSmartlySwiftSDK.podspec)
          sdk_version=$(sed -nE 's/^[[:space:]]*static let version = "([^"]+)".*/\1/p' Sources/ABSmartly/SDKVersion.swift)
          echo "tag=$version podspec=$podspec_version sdk=$sdk_version"
          if [ "$version" != "$podspec_version" ] || [ "$version" != "$sdk_version" ]; then
            echo "::error::Tag $TAG does not match podspec ($podspec_version) and SDKVersion ($sdk_version)"
            exit 1
          fi

      - name: Build and test
        run: swift test
